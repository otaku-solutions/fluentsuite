# Builds the FluentSuite Docker image here instead of on the server that runs it (release/README.md). Both Coolify
# apps (fluentsuite and fluentsuite-staging) run the same image, built from the root Dockerfile. A pull request only
# builds it; main also publishes it to GHCR as ghcr.io/otaku-solutions/fluentsuite (private) and moves the release
# branch, which Coolify deploys from, so the server only downloads an image that already exists.
name: Image

on:
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  # No path filter on main: a skipped docs-only commit would leave main's tip without a run, and the run for the
  # commit before it would then refuse to release because it is no longer the tip.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A pull request's runs share a group and the newest cancels the rest. Every other run (a main push, a re-run, a
  # manual run) gets its own group, so none can cancel another's publish; the release job below runs one at a time and
  # decides which commit moves `latest` and the release branch.
  group: image-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/fluentsuite
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: fluentsuite:check
          cache-from: type=gha,scope=fluentsuite
          cache-to: type=gha,scope=fluentsuite,mode=max
      - name: Image size
        run: docker image inspect fluentsuite:check --format '{{.Size}}' | awk '{ printf "%.0f MB\n", $1 / 1000000 }'
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Every commit gets its own sha- image; promoting it to `latest` and the release branch is the release job's call.
      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=fluentsuite

  # Moves `latest` and the branch release/fluentsuite, which Coolify deploys from (release/fluentsuite.Dockerfile), to
  # this commit, so the server only ever picks up a commit whose image is already published. Only main's newest commit
  # may do this: a re-run of an older commit's workflow keeps that commit's SHA, and would otherwise roll the apps back.
  release:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One release job at a time across all commits, so the tip check and the promotion below cannot interleave with
    # another commit's. A newer queued job replaces an older queued one, which would have found itself stale anyway.
    concurrency:
      group: image-release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/fluentsuite
    steps:
      - uses: actions/checkout@v7
      - name: Is this main's newest commit?
        id: fresh
        # bash with pipefail: a failed lookup fails the step instead of quietly skipping the release.
        shell: bash
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then echo "newest=true" >> "$GITHUB_OUTPUT"; else echo "newest=false" >> "$GITHUB_OUTPUT"; echo "main is at $tip; leaving latest and the release branch to its run"; fi
      - if: steps.fresh.outputs.newest == 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.fresh.outputs.newest == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Release
        if: steps.fresh.outputs.newest == 'true'
        shell: bash
        run: |
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:sha-$GITHUB_SHA"
          git push --force origin "HEAD:refs/heads/release/fluentsuite"
