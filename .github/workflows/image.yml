# Builds the FluentSuite Docker image on GitHub instead of on the host that runs it (release/README.md). A pull
# request only builds it; main also publishes it to GHCR as ghcr.io/otaku-solutions/fluentsuite (private) and moves the
# release branch, which deployments use, so the host only downloads an image that already exists.
name: Image

on:
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  # No path filter on main: a skipped docs-only commit would leave main's tip with no image, so nothing could
  # release it.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A pull request's runs share a group and the newest cancels the rest. Every other run (a main push, a re-run, a
  # manual run) gets its own group, so none can cancel another's publish; the release job below runs one at a time and
  # always promotes main's newest published commit.
  group: image-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/fluentsuite
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: fluentsuite:check
          cache-from: type=gha,scope=fluentsuite
          cache-to: type=gha,scope=fluentsuite,mode=max
      - name: Image size
        run: docker image inspect fluentsuite:check --format '{{.Size}}' | awk '{ printf "%.0f MB\n", $1 / 1000000 }'
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Every commit gets its own sha- image; promoting it to `latest` and the release branch is the release job's call.
      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=fluentsuite

  # Points `latest` and the branch release/fluentsuite, which deployments build (release/fluentsuite.Dockerfile), at
  # main's newest commit, once that commit's image is published, so a deploy never asks for a missing image. It always
  # promotes main's tip, never this run's own commit, so a re-run of an older commit cannot roll the release back, and
  # whichever run's job ends up running releases the right commit.
  release:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One release job at a time across all commits, so the tip lookup and the promotion cannot interleave with another
    # run's. A queued job may replace another queued one; that is safe because every job promotes the same tip.
    concurrency:
      group: image-release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/fluentsuite
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Release main's newest commit
        # bash with pipefail: a failed lookup fails the step instead of quietly skipping the release.
        shell: bash
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          [ -n "$tip" ] || { echo "could not read main's tip"; exit 1; }
          if ! out=$(docker buildx imagetools inspect "$IMAGE:sha-$tip" 2>&1); then
            if grep -qi 'not found' <<<"$out"; then echo "main is at $tip, whose image is not published yet; its own run releases it"; exit 0; fi
            echo "$out"; exit 1
          fi
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:sha-$tip"
          git fetch --depth 1 origin "$tip"
          git push --force origin "$tip:refs/heads/release/fluentsuite"
          echo "released $tip"
